[pytest]
# Configuration pytest pour ArchiExtract
# ======================================

# Repertoires de tests
testpaths = tests tests_api

# Fichiers de tests
python_files = test_*.py

# Fonctions de tests
python_functions = test_*

# Options par defaut
addopts = -v --tb=short

# Marquer les tests lents
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    api: marks API tests
    security: marks security tests
    ml: marks ML tests

# Configuration asynchrone
asyncio_mode = auto

# Chemins a ignorer
norecursedirs =
    .git .venv venv node_modules
    __pycache__ build dist *.egg-info
    .pytest_cache

# Filtres de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
