[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archiextract"
version = "1.0.0"
description = "Outil d'extraction automatique de donnees depuis les plans d'architecture"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "ArchiExtract Team"}
]
keywords = [
    "architecture",
    "extraction",
    "ocr",
    "computer-vision",
    "document-understanding",
    "real-estate"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pytesseract",
    "opencv-python",
    "Pillow",
    "numpy>=1.21.0",
    "streamlit>=1.28.0",
    "streamlit-cropper>=0.2.0",
    "pdf2image>=1.16.0",
    "python-magic>=0.4.27",
    "thefuzz>=0.20.0",
    "python-Levenshtein>=0.23.0",
    "pydantic>=2.5.0",
    "plotly>=5.18.0",
    "pytest>=7.4.0",
    "anthropic>=0.39.0",
    "PyMuPDF>=1.23.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "scikit-learn>=1.3.0",
    "accelerate>=0.25.0",
]
dev = [
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "safety>=2.3.0",
    "bandit>=1.7.0",
]

[project.scripts]
archiextract = "streamlit_app:main"

[project.urls]
Homepage = "https://github.com/yourusername/archiextract"
Repository = "https://github.com/yourusername/archiextract"
Issues = "https://github.com/yourusername/archiextract/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["archiextract*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
archiextract = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["archiextract"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.poetry]
name = "archiextract"
version = "1.0.0"
description = "Outil d'extraction automatique de donnees depuis les plans d'architecture"
authors = ["ArchiExtract Team"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/archiextract"
repository = "https://github.com/yourusername/archiextract"
documentation = "https://github.com/yourusername/archiextract#readme"
keywords = ["architecture", "extraction", "ocr", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
packages = [{include = "archiextract"}]

[tool.dependencies]
python = "^3.8"
pytesseract = "*"
opencv-python = "*"
Pillow = "*"
numpy = ">=1.21.0"
streamlit = ">=1.28.0"
streamlit-cropper = ">=0.2.0"
pdf2image = ">=1.16.0"
python-magic = ">=0.4.27"
thefuzz = ">=0.20.0"
python-Levenshtein = ">=0.23.0"
pydantic = ">=2.5.0"
plotly = ">=5.18.0"
anthropic = ">=0.39.0"
PyMuPDF = ">=1.23.0"
fastapi = ">=0.109.0"
uvicorn = ">=0.27.0"
python-multipart = ">=0.0.6"
openpyxl = ">=3.1.0"

[tool.dependencies.ml]
torch = ">=2.1.0"
transformers = ">=4.36.0"
datasets = ">=2.16.0"
scikit-learn = ">=1.3.0"
accelerate = ">=0.25.0"

[tool.dependencies.dev]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
black = ">=23.0.0"
isort = ">=5.12.0"
flake8 = ">=6.1.0"
mypy = ">=1.5.0"

[tool.poetry.scripts]
archiextract = "streamlit_app:main"
